name: Manage infrastructure

# Plan / apply / destroy this subsystem. Builds the co-located Lambda artefacts,
# then runs Terraform through the shared terraform-deploy action. The human
# approval gate is the GitHub Environment - configure required reviewers on the
# prod environment so an apply waits for sign-off.
#
# One-time per AWS account: run the "Provision state bucket" workflow, run
# scripts/iac-role.sh (creates the OIDC provider + deploy role), and create the
# artefact bucket named in subsystem.yaml. Per environment, set the Variables
# AWS_ACCOUNT_ID (required), AWS_REGION, IAC_ROLE_NAME.

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        type: choice
        required: true
        options: [plan, apply, destroy-plan, destroy]
        default: plan
      environment:
        description: Target environment
        type: environment
        required: true
        default: dev

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  manage:
    name: ${{ inputs.action }} (${{ inputs.environment }})
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate environment config
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "::error::AWS_ACCOUNT_ID is not set for environment '${{ inputs.environment }}'."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ vars.IAC_ROLE_NAME || 'atriumIaC' }}
          aws-region: ${{ env.AWS_REGION }}

      # Fail early, with a readable message, if the artefact bucket is missing -
      # far better than an opaque Terraform error minutes later.
      - name: Pre-flight - artefact bucket exists
        if: ${{ inputs.action == 'plan' || inputs.action == 'apply' }}
        run: ./scripts/preflight.sh bucket
        env:
          MANIFEST: infra/terraform/subsystem.yaml

      # The Lambda artefacts must exist in S3 before apply (AWS fetches them at
      # apply time). Plans do not need them - the module references by key.
      - name: Build and publish Lambda artefacts
        if: ${{ inputs.action == 'apply' }}
        run: ./scripts/build-artefacts.sh
        env:
          MANIFEST: infra/terraform/subsystem.yaml

      # After the build, every component's zip (co-located or external) must be
      # present at the key Terraform will reference.
      - name: Pre-flight - all artefacts present
        if: ${{ inputs.action == 'apply' }}
        run: ./scripts/preflight.sh artefacts
        env:
          MANIFEST: infra/terraform/subsystem.yaml

      - uses: dpdesi/serverless-architecture-patterns/.github/actions/terraform-deploy@v0.2.0
        with:
          command: ${{ inputs.action }}
          working-directory: infra/terraform
          aws-region: ${{ env.AWS_REGION }}
          aws-role-arn: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ vars.IAC_ROLE_NAME || 'atriumIaC' }}
          state-bucket: atrium-tfstate-${{ env.AWS_ACCOUNT_ID }}
          state-key: ${{ github.event.repository.name }}/${{ inputs.environment }}.tfstate
          plan-args: -var=region=${{ env.AWS_REGION }}
