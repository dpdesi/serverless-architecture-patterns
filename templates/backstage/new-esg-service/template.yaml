apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: new-esg-service
  title: New ESG Service
  description: Creates an External Service Gateway repository skeleton.
spec:
  owner: platform
  type: service
  parameters:
    - title: ESG Service
      required:
        - system_name
        - subsystem_name
        - owner
        - description
      properties:
        system_name:
          type: string
        subsystem_name:
          type: string
        service_type:
          type: string
          default: esg
        owner:
          type: string
        description:
          type: string
        primary_region:
          type: string
          default: eu-west-2
        secondary_region:
          type: string
          default: eu-west-1
        environment_tiers:
          type: array
          items:
            type: string
          default: [dev, np, prod]
        auth_mode:
          type: string
          default: jwt
        event_transport:
          type: string
          default: eventbridge
        workflow_mode:
          type: string
          default: event_reactor
        artefact_registry:
          type: string
          default: s3
        use_localstack:
          type: boolean
          default: true
        publish_to_registry:
          type: boolean
          default: false
        observability_sink:
          type: string
          default: cloudwatch
  steps:
    - id: fetch
      name: Render skeleton
      action: fetch:template
      input:
        url: ../new-subsystem/skeleton
        values: ${{ parameters }}
