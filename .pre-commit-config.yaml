# Install once with: pre-commit install
# Run across the whole repo with: pre-commit run --all-files
#
# Pairs with .gitattributes: .gitattributes is the declarative source of truth
# for line endings; these hooks fix files in the working tree before they are
# committed.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
